[project]
name = "annuaire-project"
auteur = "Mohamed NEIMY"
version = "0.1.0"
    description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]
[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "pydantic.*", "requests.*"]
ignore_missing_imports = true

