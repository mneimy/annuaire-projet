[project]
name = "annuaire-project"
version = "0.1.0"
description = "Consultation et analyse de l'annuaire de l'éducation."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Mohamed NEIMY" }]
dependencies = [
    "altair>=6.3.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pydeck>=0.9.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[[tool.mypy.overrides]]
module = ["altair.*", "pandas.*", "polars.*", "pyarrow.*", "pydantic.*", "pydeck.*", "requests.*", "streamlit.*"]
ignore_missing_imports = true
